<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" />
  <title>Flowgit</title>
  <link rel="stylesheet" href="./home.css" />
</head>
<body>
  <header class="top">
    <div class="brand-block">
      <p class="brand">Flowgit</p>
      <h1 id="title"></h1>
      <p class="tagline" id="tagline"></p>
    </div>
    <div class="top-side">
      <div class="lang-switch" role="group" id="lang-group">
        <button type="button" data-lang="zh" lang="zh-CN">中文</button>
        <button type="button" data-lang="en" lang="en">EN</button>
      </div>
    </div>
  </header>
  <p id="status" class="status" role="status" hidden></p>
  <main>
    <section class="panel-block">
      <header class="section-head">
        <span class="num">01</span>
        <h2 id="recent-heading"></h2>
      </header>
      <p id="recent-empty" class="empty"></p>
      <ul id="recent" class="list"></ul>
      <button id="open" class="primary" type="button"></button>
    </section>
    <section class="panel-block">
      <header class="section-head">
        <span class="num">02</span>
        <h2 id="create-heading"></h2>
      </header>
      <ul id="templates" class="templates"></ul>
    </section>
    <section class="panel-block">
      <header class="section-head">
        <span class="num">03</span>
        <h2 id="doctor-heading"></h2>
      </header>
      <ul id="doctor" class="doctor"></ul>
    </section>
  </main>
  <script src="./home.js"></script>
</body>
</html>
