<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="flowgit-token" content="__FLOWGIT_TOKEN__" />
  <title>Flowgit 看板 / Board</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand-block">
      <p class="brand">Flowgit</p>
      <h1 id="flow-name">看板 / Board</h1>
      <p class="tagline">可运行、可修改、可回看 · 本机 / run, edit, and browse history · local</p>
    </div>
    <div class="top-side">
      <p class="hint" id="refresh-hint">每 3 秒刷新 / refreshes every 3s</p>
      <button id="run-all" type="button">全部运行 Run all</button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <section class="inputs-panel" aria-labelledby="inputs-heading">
    <h2 id="inputs-heading">流程输入 / Flow inputs</h2>
    <form id="inputs-form">
      <div id="inputs" class="input-fields"></div>
      <p id="inputs-status" class="inputs-status" hidden></p>
      <button id="inputs-save" type="submit" disabled>保存输入 Save inputs</button>
    </form>
  </section>
  <p id="notice" class="notice" hidden></p>
  <pre id="log" class="log" hidden></pre>
  <main id="board" class="board" aria-live="polite"></main>
  <aside id="panel" class="panel" hidden>
    <div class="panel-bar">
      <h2 id="panel-title"></h2>
      <button id="panel-close" type="button">关闭 / Close</button>
    </div>
    <div id="panel-body"></div>
  </aside>
  <noscript>
    <p class="banner">需要 JavaScript 才能看看板。 / JavaScript is required to show the board.</p>
  </noscript>
  <script src="/app.js"></script>
</body>
</html>
