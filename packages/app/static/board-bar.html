<nav class="app-bar" aria-label="网页版 / Web app">
  <a class="app-home" href="/index.html" data-i18n-raw="← 我的流程 / ← My flows">← 我的流程</a>
  <p id="app-note" class="app-note" hidden></p>
  <button id="app-access" class="app-access btn small primary" type="button" hidden data-i18n-raw="允许读写这个文件夹 / Allow access to this folder">允许读写这个文件夹</button>
  <button id="app-save-folder" class="app-save-folder btn small" type="button" hidden data-i18n-raw="存到文件夹 / Save to a folder">存到文件夹</button>
  <button id="app-local" class="app-local btn small" type="button" hidden data-i18n-raw="本机看板 / Local board">本机看板</button>
  <button id="app-export" class="app-export btn small" type="button" data-i18n-raw="导出 zip / Export zip">导出 zip</button>
  <button id="app-keys" class="app-keys btn small" type="button" data-i18n-raw="模型 key / Model key">模型 key</button>
</nav>
<dialog id="keys-dialog" class="keys-dialog">
  <form id="keys-form" method="dialog">
    <h2 data-i18n-raw="模型和 key / Model and key">模型和 key</h2>
    <p class="hint" data-i18n-raw="key 默认只在这个页面的内存里，关掉页面就没了；不会写进流程文件或导出的文件。 / By default the key stays in this page's memory and is gone when you close it; it is never written to flow files or exports.">key 默认只在这个页面的内存里，关掉页面就没了；不会写进流程文件或导出的文件。</p>
    <label class="field"><span data-i18n-raw="模型厂商 / Vendor">模型厂商</span><select id="keys-vendor"></select></label>
    <label class="field"><span data-i18n-raw="API key / API key">API key</span><input id="keys-key" type="password" autocomplete="off" spellcheck="false" /></label>
    <p class="hint"><a id="keys-get" href="#" target="_blank" rel="noopener noreferrer" data-i18n-raw="去厂商网站拿 key / Get a key from the vendor">去厂商网站拿 key</a></p>
    <label class="check"><input id="keys-remember" type="checkbox" /> <span data-i18n-raw="在这台设备记住（存进这个浏览器）/ Remember on this device (stored in this browser)">在这台设备记住（存进这个浏览器）</span></label>
    <label class="check" id="keys-demo-row" hidden><input id="keys-demo" type="checkbox" /> <span data-i18n-raw="用模板自带的示例回复，不调用模型 / Use the template's demo replies instead of a model">用模板自带的示例回复，不调用模型</span></label>
    <p class="hint" data-i18n-raw="其他厂商（OpenAI、智谱、Kimi、通义）不允许网页直接调用，请在电脑上用 flowgit 命令运行。 / Other vendors (OpenAI, GLM, Kimi, Qwen) don't accept calls from a web page; run those with the flowgit command on a computer.">其他厂商（OpenAI、智谱、Kimi、通义）不允许网页直接调用，请在电脑上用 flowgit 命令运行。</p>
    <div class="dialog-actions">
      <button id="keys-forget" class="btn quiet" type="button" data-i18n-raw="清除 key / Clear key">清除 key</button>
      <button id="keys-cancel" class="btn" type="button" data-i18n-raw="取消 / Cancel">取消</button>
      <button id="keys-save" class="btn primary" type="submit" data-i18n-raw="保存 / Save">保存</button>
    </div>
  </form>
</dialog>
<dialog id="local-dialog" class="keys-dialog">
  <form id="local-form">
    <h2 data-i18n-raw="交给本机看板运行 / Hand off to the local board">交给本机看板运行</h2>
    <p class="hint" data-i18n-raw="网页不能运行命令。在这个流程的文件夹里运行 flowgit board，把它打印的链接（结尾是 ?token=…）粘贴到这里；之后要在电脑上运行的步骤会交给它跑，结果会回到这个页面。链接只留在这个页面的内存里。 / A web page can't run commands. Run flowgit board in this flow's folder and paste the link it prints (ending in ?token=…) here; steps that need a computer then run there and their results come back to this page. The link stays in this page's memory only.">网页不能运行命令。在这个流程的文件夹里运行 flowgit board，把它打印的链接（结尾是 ?token=…）粘贴到这里；之后要在电脑上运行的步骤会交给它跑，结果会回到这个页面。链接只留在这个页面的内存里。</p>
    <label class="field"><span data-i18n-raw="flowgit board 的链接 / Link from flowgit board">flowgit board 的链接</span><input id="local-link" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="http://127.0.0.1:4747/?token=…" /></label>
    <p class="hint" data-i18n-raw="Chrome 会问是否允许这个网站访问本地网络，请选允许。 / Chrome asks whether this site may access your local network; choose Allow.">Chrome 会问是否允许这个网站访问本地网络，请选允许。</p>
    <p id="local-status" class="local-status" role="status" hidden></p>
    <div class="dialog-actions">
      <button id="local-forget" class="btn quiet" type="button" data-i18n-raw="断开 / Disconnect">断开</button>
      <button id="local-cancel" class="btn" type="button" data-i18n-raw="关闭 / Close">关闭</button>
      <button id="local-connect" class="btn primary" type="submit" data-i18n-raw="连接 / Connect">连接</button>
    </div>
  </form>
</dialog>
