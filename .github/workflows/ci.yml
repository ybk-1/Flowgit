name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install FFmpeg and a CJK font (for the render test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-wqy-zenhei
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - name: Test
        run: pnpm test
        env:
          # Force a font on Windows so the render test always draws captions with
          # drive-letter paths (C:) in the FFmpeg filter; Arial is always present.
          FLOWGIT_FONT: ${{ runner.os == 'Windows' && 'C:\Windows\Fonts\arial.ttf' || '' }}
      - name: 打包后像用户一样安装 / Pack and install like a user
        run: node scripts/pack-smoke.mjs
