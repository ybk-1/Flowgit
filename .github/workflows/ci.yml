name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install FFmpeg and a CJK font (for the render test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-wqy-zenhei
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The Chocolatey feed sometimes answers 406 or 503; try three times before failing.
          for ($i = 1; $i -le 3; $i++) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -eq 0 -and (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { exit 0 }
            Write-Host "ffmpeg 没装上，第 $i 次 / ffmpeg not installed, attempt $i"
            Start-Sleep -Seconds (30 * $i)
          }
          throw "Chocolatey 装不上 ffmpeg / ffmpeg could not be installed from Chocolatey"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - name: "浏览器入口不含 node: 模块 / The browser entry has no node: modules"
        if: runner.os == 'Linux'
        run: pnpm --filter @flowgit/core check:browser
      - name: Test
        run: pnpm test
        env:
          # Force a font on Windows so the render test always draws captions with
          # drive-letter paths (C:) in the FFmpeg filter; Arial is always present.
          FLOWGIT_FONT: ${{ runner.os == 'Windows' && 'C:\Windows\Fonts\arial.ttf' || '' }}
      - name: 打包后像用户一样安装 / Pack and install like a user
        run: node scripts/pack-smoke.mjs
      - name: README 的 PowerShell 快速开始 / The README's PowerShell quick start
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FLOWGIT_LLM_MOCK_DIR: demo-replies
        run: |
          # The README's Windows commands, with the demo replies instead of an API key.
          $fg = "$PWD\packages\cli\dist\index.js"
          function flowgit { node $fg @args }
          flowgit init $env:RUNNER_TEMP\my-video
          cd $env:RUNNER_TEMP\my-video
          flowgit inputs set topic="为什么猫喜欢纸箱"
          flowgit doctor
          if ($LASTEXITCODE -ne 0) { throw "doctor should find node, ffmpeg and the demo replies, got exit code $LASTEXITCODE" }
          flowgit run all
          if ($LASTEXITCODE -ne 2) { throw "run all should stop at the assets stage (exit 2), got $LASTEXITCODE" }
          mkdir assets
          flowgit run all
          if ($LASTEXITCODE -ne 0) { throw "run all failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path final.mp4)) { throw "final.mp4 was not written" }
          flowgit status

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: 安装 FFmpeg（短视频用例要导出视频）/ Install FFmpeg (the short-video test exports a video)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: 网页版在浏览器里跑 weekly-report / The web app runs weekly-report in the browser
        if: success() || failure()
        run: pnpm test:e2e:app
      - name: 网页版接上本机云端 / The web app against the local cloud
        if: success() || failure()
        run: pnpm test:e2e:cloud
      - name: 失败时上传报告和 trace / Upload the report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
