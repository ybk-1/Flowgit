name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install FFmpeg and a CJK font (for the render test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-wqy-zenhei
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - name: Test
        run: pnpm test
        env:
          # Force a font on Windows so the render test always draws captions with
          # drive-letter paths (C:) in the FFmpeg filter; Arial is always present.
          FLOWGIT_FONT: ${{ runner.os == 'Windows' && 'C:\Windows\Fonts\arial.ttf' || '' }}
      - name: 打包后像用户一样安装 / Pack and install like a user
        run: node scripts/pack-smoke.mjs
      - name: README 的 PowerShell 快速开始 / The README's PowerShell quick start
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FLOWGIT_LLM_MOCK_DIR: demo-replies
        run: |
          # The README's Windows commands, with the demo replies instead of an API key.
          $fg = "$PWD\packages\cli\dist\index.js"
          function flowgit { node $fg @args }
          flowgit init $env:RUNNER_TEMP\my-video
          cd $env:RUNNER_TEMP\my-video
          flowgit inputs set topic="为什么猫喜欢纸箱"
          flowgit doctor
          if ($LASTEXITCODE -ne 0) { throw "doctor should find node, ffmpeg and the demo replies, got exit code $LASTEXITCODE" }
          flowgit run all
          if ($LASTEXITCODE -ne 2) { throw "run all should stop at the assets stage (exit 2), got $LASTEXITCODE" }
          mkdir assets
          flowgit run all
          if ($LASTEXITCODE -ne 0) { throw "run all failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path final.mp4)) { throw "final.mp4 was not written" }
          flowgit status
